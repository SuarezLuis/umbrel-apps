manifestVersion: 1
id: sz-lanscape
name: LANscape
tagline: See what's happening on your home network
icon: https://raw.githubusercontent.com/SuarezLuis/umbrel-apps/master/sz-lanscape/icon.svg
category: networking
version: "1.13.0"
port: 4545
description: >-
  LANscape watches your home network from your Umbrel. Run speed tests on
  demand or on a schedule and see how your speed and latency change over
  time. A ping check every minute tracks router and internet latency and
  packet loss with almost no data. Every device on your network is listed
  with its maker and name, and you can identify unknown ones by switching
  them off and on. Alerts for slow speeds, packet loss, new devices or a
  device going offline reach you through ntfy, Telegram, Discord, Slack or a
  webhook.


  LANscape uses the password Umbrel shows for it in the app's menu.
developer: SuarezLuis
website: https://github.com/SuarezLuis/lanscape
submitter: SuarezLuis
submission: https://github.com/SuarezLuis/umbrel-apps
repo: https://github.com/SuarezLuis/umbrel-apps
support: https://github.com/SuarezLuis/lanscape/issues
gallery:
  - https://raw.githubusercontent.com/SuarezLuis/lanscape/master/docs/assets/gallery/1.jpg
  - https://raw.githubusercontent.com/SuarezLuis/lanscape/master/docs/assets/gallery/2.jpg
  - https://raw.githubusercontent.com/SuarezLuis/lanscape/master/docs/assets/gallery/3.jpg
  - https://raw.githubusercontent.com/SuarezLuis/lanscape/master/docs/assets/gallery/4.jpg
  - https://raw.githubusercontent.com/SuarezLuis/lanscape/master/docs/assets/gallery/5.jpg
  - https://raw.githubusercontent.com/SuarezLuis/lanscape/master/docs/assets/gallery/6.jpg
  - https://raw.githubusercontent.com/SuarezLuis/lanscape/master/docs/assets/gallery/7.jpg
releaseNotes: >-
  Find out which device is which without unplugging anything: with Pi-hole
  connected, pause a device's internet for a few minutes from its panel, and
  whatever stops loading is that device. Devices that don't name their model
  now show a best guess (camera, Roku, Android phone, home server…) with the
  clues behind it.
environment:
  - name: RESET_PASSWORD
    services:
      - server
    note: Set to yes and restart LANscape to reset its password to the one Umbrel shows. Clear it afterwards, or each restart resets it again.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
