version: "3.7"

services:
  server:
    image: ntop/ntopng:latest
    restart: on-failure
    # Host network so ntopng sees the Umbrel's real interface, not a Docker bridge
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/ntopng
    command: ["-i", "eno1", "-w", "4545", "--dont-change-user"]
