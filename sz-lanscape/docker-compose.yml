version: "3.7"

services:
  server:
    image: ghcr.io/suarezluis/lanscape:1.2.0@sha256:a0d64d12f176846522f0ca408efb03470d7ad28fa69f938841a481627850b9c5
    restart: on-failure
    # Node runs as PID 1; init reaps the speed test processes it starts
    init: true
    # Host network so device discovery sees the real LAN, not a Docker bridge
    network_mode: host
    environment:
      PORT: 4545
      # Umbrel's per-install password, shown on the dashboard (deterministicPassword); seeds LANscape's password
      APP_PASSWORD: $APP_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/data:/data
