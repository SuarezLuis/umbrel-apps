version: "3.7"

services:
  server:
    image: ghcr.io/suarezluis/lanscape:1.0.1@sha256:5495804907df281ba223d26965a5c767085aa81a90e1e41b1158d4b537de604d
    restart: on-failure
    # Node runs as PID 1; init reaps the speed test processes it starts
    init: true
    # Host network so device discovery sees the real LAN, not a Docker bridge
    network_mode: host
    environment:
      PORT: 4545
    volumes:
      - ${APP_DATA_DIR}/data:/data
