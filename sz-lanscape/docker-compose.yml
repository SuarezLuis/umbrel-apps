version: "3.7"

services:
  server:
    image: ghcr.io/suarezluis/lanscape:1.4.0@sha256:d3c2999d68a93fb27826c2e3868018b3d3f2f93aa7ee4077fe8182c581e940e8
    restart: on-failure
    # Node runs as PID 1; init reaps the speed test processes it starts
    init: true
    # Host network so device discovery sees the real LAN, not a Docker bridge
    network_mode: host
    environment:
      PORT: 4545
      # Umbrel's per-install password, shown on the dashboard (deterministicPassword); seeds LANscape's password
      APP_PASSWORD: $APP_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/data:/data
