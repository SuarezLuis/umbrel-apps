version: "3.7"

services:
  server:
    image: ghcr.io/suarezluis/lanscape:1.14.1@sha256:0571438a3d1b5af68df325080815c1c9881ae430829eb6d8d4c38eac729066c6
    restart: on-failure
    # Node runs as PID 1; init reaps the speed test processes it starts
    init: true
    # Host network so device discovery sees the real LAN, not a Docker bridge
    network_mode: host
    environment:
      PORT: 4545
      # Umbrel's per-install password, shown on the dashboard (deterministicPassword); seeds LANscape's password
      APP_PASSWORD: $APP_PASSWORD
      # Tells LANscape it runs on Umbrel, so password help points at the Umbrel dashboard
      UMBREL: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/data
