version: "3.7"

services:
  server:
    image: ghcr.io/suarezluis/lanscape:1.6.0@sha256:e2f4fe7655003259c52f0bf4b0f0a69f8124fb708fee8e9ed77b70be7f7a30cd
    restart: on-failure
    # Node runs as PID 1; init reaps the speed test processes it starts
    init: true
    # Host network so device discovery sees the real LAN, not a Docker bridge
    network_mode: host
    environment:
      PORT: 4545
      # Umbrel's per-install password, shown on the dashboard (deterministicPassword); seeds LANscape's password
      APP_PASSWORD: $APP_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/data:/data
