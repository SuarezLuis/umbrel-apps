version: "3.7"

services:
  server:
    image: ghcr.io/suarezluis/lanscape:1.5.1@sha256:d70ddb281f4ce2fc6157b6e59856f06d0dff35a52c5de269460a5892c60fa505
    restart: on-failure
    # Node runs as PID 1; init reaps the speed test processes it starts
    init: true
    # Host network so device discovery sees the real LAN, not a Docker bridge
    network_mode: host
    environment:
      PORT: 4545
      # Umbrel's per-install password, shown on the dashboard (deterministicPassword); seeds LANscape's password
      APP_PASSWORD: $APP_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/data:/data
